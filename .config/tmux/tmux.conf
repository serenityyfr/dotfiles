set-option -g default-terminal "screen-256color"
set-option -g status-style bg='#0f111b',fg='#ecf0c1'
set -g pane-active-border-style "fg=#5ccc96"
set -g pane-border-style "fg=#686f9a"
set-option -g window-status-current-style bg='#686f9a',fg='#ffffff'

set-option -g message-style bg='#686f9a',fg='#ecf0c1'
set-option -g message-command-style bg='#686f9a',fg='#ecf0c1'

# When Commands are run (idk what that means i just left it in from the config i started off of)
set -g message-style "fg=#1f111b,bg=#686f9a"


# STATUS BAR


# Enable mouse support (tmux 2.1+)
set -g mouse on
# Prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# SPLITS
# The -c flag preserves the current working directory in the new pane
unbind '"'
unbind %
bind "'" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"

# VIM STYLE NAVIGATION

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

