"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#7a5ccc)\
$username\
[](bg:#ce6f8f fg:#7a5ccc)\
$directory\
[](fg:#ce6f8f bg:#e39400)\
$git_branch\
$git_status\
[](fg:#e39400 bg:#00a3cc)\
$docker_context\
[](fg:#00a3cc bg:#33658A)\
[ ](fg:#33658A)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#7a5ccc"
style_root = "bg:#9A348E"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#9A348E"
disabled = true # Disabled by default

[directory]
style = "bg:#ce6f8f"
format = "[ $path ]($style)"
truncation_length = 1
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.

[c]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ]($style)'

[cpp]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ]($style)'

[docker_context]
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style)'

[git_branch]
symbol = ""
style = "bg:#e39400"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#e39400"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ]($style)'
