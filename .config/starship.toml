"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#b279a7)\
$username\
[](bg:#de6e7c fg:#b279a7)\
$directory\
[](fg:#de6e7c bg:#b77e64)\
$git_branch\
$git_status\
[](fg:#b77e64 bg:#66a5ad)\
$docker_context\
[](fg:#66a5ad bg:#6099c0)\
$c\
$cpp\
$golang\
[ ](fg:#6099c0)\
"""

[username]
show_always = true
style_user = "bg:#b279a7 fg:#1c1917 bold"
style_root = "bg:#e8838f fg:#1c1917 bold"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:#b279a7 fg:#1c1917"
disabled = true

[directory]
style = "bg:#de6e7c fg:#1c1917 bold"
format = "[ $path ]($style)"
truncation_length = 1
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#b77e64 fg:#1c1917 bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#b77e64 fg:#1c1917"
format = '[$all_status$ahead_behind ]($style)'

[docker_context]
symbol = " "
style = "bg:#66a5ad fg:#1c1917"
format = '[ $symbol $context ]($style)'

[c]
symbol = " "
style = "bg:#6099c0 fg:#1c1917"
format = '[ $symbol ]($style)'

[cpp]
symbol = " "
style = "bg:#6099c0 fg:#1c1917"
format = '[ $symbol ]($style)'

[golang]
symbol = " "
style = "bg:#6099c0 fg:#1c1917"
format = '[ $symbol ]($style)'
